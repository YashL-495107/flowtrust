<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowTrust AI — Loading</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        serif: ['"Source Serif 4"', 'ui-serif', 'Georgia', 'serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        ink: '#1a1a1a',
                        paper: '#f9f8f6',
                        canvas: '#f3f1ed',
                        line: '#e4e1db',
                        muted: '#6e6b64',
                        skeleton: '#eeece8',
                        teal: {
                            DEFAULT: '#2d4f4f',
                            soft: '#eaf1f1',
                            deep: '#1e3636',
                        },
                        sage: '#62826c',
                        rust: '#b85c5c',
                    }
                }
            }
        }
    </script>

    <style>
        .skeleton-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Bar -->
    <header class="h-16 bg-canvas border-b border-line flex items-center justify-between px-6 lg:px-8 shrink-0 z-20 relative">
        <div class="flex items-center gap-3">
            <span class="font-serif text-xl tracking-tight text-teal">FlowTrust</span>
        </div>
        <div class="flex items-center gap-5">
            <div class="w-8 h-8 rounded-full bg-skeleton skeleton-pulse"></div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <!-- Sidebar -->
        <aside class="w-[72px] lg:w-[220px] bg-canvas border-r border-line flex flex-col py-6 shrink-0 z-10 hidden md:flex">
            <div class="px-6 space-y-4">
                <div class="h-4 w-full bg-skeleton rounded skeleton-pulse"></div>
                <div class="h-4 w-4/5 bg-skeleton rounded skeleton-pulse"></div>
                <div class="h-4 w-3/4 bg-skeleton rounded skeleton-pulse"></div>
                <div class="h-4 w-5/6 bg-skeleton rounded skeleton-pulse"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-6 lg:p-8">

            <!-- Skeleton Metrics -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-px bg-line rounded-lg overflow-hidden border border-line mb-6">
                <div class="bg-paper p-5">
                    <div class="h-3 w-24 bg-skeleton rounded mb-3 skeleton-pulse"></div>
                    <div class="h-8 w-32 bg-skeleton rounded skeleton-pulse"></div>
                </div>
                <div class="bg-paper p-5">
                    <div class="h-3 w-20 bg-skeleton rounded mb-3 skeleton-pulse"></div>
                    <div class="h-8 w-16 bg-skeleton rounded skeleton-pulse"></div>
                </div>
                <div class="bg-paper p-5">
                    <div class="h-3 w-28 bg-skeleton rounded mb-3 skeleton-pulse"></div>
                    <div class="h-8 w-20 bg-skeleton rounded skeleton-pulse"></div>
                </div>
            </section>

            <!-- Asymmetric Two-Panel Split -->
            <section class="grid grid-cols-1 xl:grid-cols-[4fr_6fr] gap-4">

                <!-- Left Panel -->
                <div class="flex flex-col gap-4">
                    <div class="bg-white border border-line rounded-lg p-5 h-40">
                         <div class="h-4 w-32 bg-skeleton rounded mb-6 skeleton-pulse"></div>
                         <div class="space-y-3">
                             <div class="h-9 w-full bg-skeleton rounded skeleton-pulse"></div>
                             <div class="h-9 w-full bg-skeleton rounded skeleton-pulse"></div>
                         </div>
                    </div>

                    <div class="bg-white border border-line rounded-lg overflow-hidden">
                        <div class="px-5 py-4 border-b border-line">
                            <div class="h-4 w-40 bg-skeleton rounded skeleton-pulse"></div>
                        </div>
                        <div class="p-5 space-y-6">
                            <div class="flex items-center gap-4">
                                <div class="w-8 h-8 rounded bg-skeleton skeleton-pulse"></div>
                                <div class="flex-1 space-y-2">
                                    <div class="h-3 w-full bg-skeleton rounded skeleton-pulse"></div>
                                    <div class="h-3 w-2/3 bg-skeleton rounded skeleton-pulse"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-8 h-8 rounded bg-skeleton skeleton-pulse"></div>
                                <div class="flex-1 space-y-2">
                                    <div class="h-3 w-full bg-skeleton rounded skeleton-pulse"></div>
                                    <div class="h-3 w-1/2 bg-skeleton rounded skeleton-pulse"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-8 h-8 rounded bg-skeleton skeleton-pulse"></div>
                                <div class="flex-1 space-y-2">
                                    <div class="h-3 w-full bg-skeleton rounded skeleton-pulse"></div>
                                    <div class="h-3 w-3/4 bg-skeleton rounded skeleton-pulse"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Panel -->
                <div class="bg-ink rounded-lg border border-line h-[500px] p-6 space-y-4">
                    <div class="h-4 w-48 bg-white/5 rounded skeleton-pulse"></div>
                    <div class="space-y-3 pt-6">
                        <div class="h-3 w-3/4 bg-white/5 rounded skeleton-pulse"></div>
                        <div class="h-3 w-1/2 bg-white/5 rounded skeleton-pulse"></div>
                        <div class="h-3 w-2/3 bg-white/5 rounded skeleton-pulse"></div>
                        <div class="h-3 w-full bg-white/5 rounded skeleton-pulse"></div>
                    </div>
                </div>
            </section>

        </main>
    </div>
</body>
</html>
